name: Analyse LK Oppo A15 (appelant du menu boot)

on:
  workflow_dispatch:
    inputs:
      lk_url:
        description: "Lien DIRECT du fichier lk"
        required: true
      lk_size:
        description: "Taille du code LK"
        required: true
        default: "3955398"
      file_size:
        description: "Taille attendue du fichier complet"
        required: true
        default: "4084144"
      base_addr:
        required: true
        default: "0x48000000"

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Télécharger le LK et vérifier la taille
        run: |
          curl -fL -o lk.img "${{ github.event.inputs.lk_url }}"
          SIZE=$(stat -c %s lk.img)
          if [ "$SIZE" != "${{ github.event.inputs.file_size }}" ]; then
            echo "ERREUR: taille incorrecte ($SIZE)"
            exit 1
          fi
          tail -c +513 lk.img | head -c ${{ github.event.inputs.lk_size }} > lk.bin

      - name: Télécharger Ghidra
        run: |
          curl -L -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip"
          unzip -q ghidra.zip
          mv ghidra_11.2.1_PUBLIC ghidra

      - name: Écrire le script d'analyse
        run: |
          cat > lk_report.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import traceback
          from java.math import BigInteger
          from ghidra.app.decompiler import DecompInterface
          from ghidra.util.task import ConsoleTaskMonitor

          BASE = 0x48000000
          out = open("/tmp/report.txt", "w")

          def log(s):
              out.write(s + "\n")
              out.flush()
              print(s)

          try:
              prog = currentProgram
              mem = prog.getMemory()
              fm = prog.getFunctionManager()
              ctx = prog.getProgramContext()
              tm = ctx.getRegister("TMode")
              ctx.setValue(tm, toAddr(BASE + 0x100), mem.getMaxAddress(), BigInteger.ONE)

              seeds = [0x48026a8c, 0x48027408, 0x480218c4, 0x480215cc, 0x480216a0,
                       0x4802e5ec, 0x4802e720, 0x4802e7b4]
              for a in seeds:
                  disassemble(toAddr(a))
                  if fm.getFunctionAt(toAddr(a)) is None:
                      createFunction(toAddr(a), None)

              analyzeAll(prog)
              log("fonctions: %d" % fm.getFunctionCount())

              refman = prog.getReferenceManager()
              di = DecompInterface()
              di.openProgram(prog)
              mon = ConsoleTaskMonitor()

              def dec(f):
                  r = di.decompileFunction(f, 180, mon)
                  if r.decompileCompleted():
                      return r.getDecompiledFunction().getC()
                  return "ECHEC DECOMPILATION"

              # Trouver et decompiler TOUTES les fonctions qui appellent les 3 ecrans de menu
              callers = set()
              for target in (0x4802e5ec, 0x4802e720, 0x4802e7b4):
                  f = fm.getFunctionAt(toAddr(target))
                  if f is None:
                      log("pas de fonction a 0x%x" % target)
                      continue
                  refs = refman.getReferencesTo(f.getEntryPoint())
                  for r in refs:
                      cf = fm.getFunctionContaining(r.getFromAddress())
                      if cf is not None:
                          callers.add(cf)

              log("Appelants trouves: %s" % [str(c.getEntryPoint()) for c in callers])
              for c in callers:
                  log("=" * 70)
                  log("APPELANT : %s @ %s (offset fichier 0x%x)" % (c.getName(), c.getEntryPoint(), c.getEntryPoint().getOffset() - BASE + 0x200))
                  log(dec(c))

              # Aussi: fonctions appelees PAR ce(s) appelant(s) (pour trouver la lecture de touches)
              done = set()
              for c in list(callers):
                  insns = currentProgram.getListing().getInstructions(c.getBody(), True)
                  for ins in insns:
                      for r in ins.getReferencesFrom():
                          tf = fm.getFunctionAt(r.getToAddress())
                          if tf is not None and tf not in callers and tf.getEntryPoint() not in done:
                              done.add(tf.getEntryPoint())
                              log("=" * 70)
                              log("SOUS-FONCTION APPELEE : %s @ %s (offset fichier 0x%x)" % (tf.getName(), tf.getEntryPoint(), tf.getEntryPoint().getOffset() - BASE + 0x200))
                              log(dec(tf))
              log("FIN")
          except Exception:
              log("ERREUR FATALE\n%s" % traceback.format_exc())
          out.close()
          PYEOF

      - name: Lancer Ghidra (headless)
        run: |
          mkdir -p proj
          ./ghidra/support/analyzeHeadless proj lkproj \
            -import lk.bin \
            -processor "ARM:LE:32:v7" \
            -loader BinaryLoader \
            -loader-baseAddr "${{ github.event.inputs.base_addr }}" \
            -noanalysis \
            -scriptPath "$PWD" \
            -postScript lk_report.py 2>&1 | tee ghidra.log

      - name: Afficher le rapport
        if: always()
        run: |
          head -c 60000 /tmp/report.txt || true
          cp /tmp/report.txt . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lk-report
          path: |
            report.txt
            ghidra.log
