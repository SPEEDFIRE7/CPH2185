name: Patch LK Oppo A15 - Boutons Vol Up/Down (Stage 1 - test sans reboot)

on:
  workflow_dispatch:
    inputs:
      lk_url:
        description: "Lien DIRECT du fichier lk"
        required: true
      lk_size:
        required: true
        default: "3955398"
      file_size:
        required: true
        default: "4084144"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le LK et vérifier la taille
        run: |
          curl -fL -o lk.img "${{ github.event.inputs.lk_url }}"
          SIZE=$(stat -c %s lk.img)
          if [ "$SIZE" != "${{ github.event.inputs.file_size }}" ]; then
            echo "ERREUR: taille incorrecte ($SIZE, attendu ${{ github.event.inputs.file_size }})"
            exit 1
          fi

      - name: Appliquer le patch
        run: |
          python3 - <<'PYEOF'
          import struct

          with open("lk.img", "rb") as f:
              data = bytearray(f.read())

          expected_size = ${{ github.event.inputs.file_size }}
          assert len(data) == expected_size, "taille inattendue"

          HOOK_OFFSET  = 162374
          CAVE_OFFSET  = 666426
          HOOK_ORIG    = bytes.fromhex("204604b0")
          HOOK_NEW     = bytes.fromhex("7bf0aef8")
          CAVE_BYTES   = bytes.fromhex("")

          # verifications de securite avant d'ecrire
          assert data[HOOK_OFFSET:HOOK_OFFSET+4] == HOOK_ORIG, \
              "Octets inattendus au point d'accroche (fichier modifie ou offset incorrect) - ARRET"
          cave_zone = data[CAVE_OFFSET:CAVE_OFFSET+len(CAVE_BYTES)]
          assert all(b == 0 for b in cave_zone), \
              "La zone libre (code cave) n'est pas vide - ARRET pour eviter d'ecraser du code"

          # application
          data[CAVE_OFFSET:CAVE_OFFSET+len(CAVE_BYTES)] = CAVE_BYTES
          data[HOOK_OFFSET:HOOK_OFFSET+4] = HOOK_NEW

          with open("lk_patched.img", "wb") as f:
              f.write(data)

          print("Patch applique avec succes.")
          print("Taille originale:", len(data), "octets (inchangee)")
          PYEOF
          ls -l lk_patched.img

      - uses: actions/upload-artifact@v4
        with:
          name: lk-patched-stage1
          path: lk_patched.img
