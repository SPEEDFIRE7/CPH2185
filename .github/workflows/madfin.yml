name: Analyse LK Oppo A15 (fonctions)

on:
  workflow_dispatch:
    inputs:
      lk_url:
        description: "Lien DIRECT du fichier lk (ex: https://pixeldrain.com/api/file/ID)"
        required: true
      funcs:
        description: "Adresses des fonctions à décompiler (séparées par des virgules)"
        required: true
        default: "0x4802810c,0x48028148,0x4802851c,0x480284ec,0x48027ed0,0x480050ec,0x480223bc,0x480225d0,0x48004e4c,0x4802e5ec,0x4802e720,0x4802e7b4"
      lk_size:
        description: "Taille du code LK (octets, depuis l'en-tête)"
        required: true
        default: "3955398"
      file_size:
        description: "Taille attendue du fichier complet lk.img"
        required: true
        default: "4084144"
      base_addr:
        description: "Adresse de base"
        required: true
        default: "0x48000000"

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Télécharger le LK et vérifier la taille
        run: |
          curl -fL -o lk.img "${{ github.event.inputs.lk_url }}"
          SIZE=$(stat -c %s lk.img)
          echo "Taille téléchargée: $SIZE octets (attendu: ${{ github.event.inputs.file_size }})"
          if [ "$SIZE" != "${{ github.event.inputs.file_size }}" ]; then
            echo "ERREUR: le fichier téléchargé n'est pas le bon."
            head -c 300 lk.img
            exit 1
          fi
          tail -c +513 lk.img | head -c ${{ github.event.inputs.lk_size }} > lk.bin
          ls -l lk.bin

      - name: Télécharger Ghidra
        run: |
          curl -L -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip"
          unzip -q ghidra.zip
          mv ghidra_11.2.1_PUBLIC ghidra

      - name: Écrire le script d'analyse
        run: |
          cat > lk_report.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import os
          import traceback
          from java.math import BigInteger
          from ghidra.app.decompiler import DecompInterface
          from ghidra.util.task import ConsoleTaskMonitor

          BASE = 0x48000000
          out = open("/tmp/report.txt", "w")

          def log(s):
              out.write(s + "\n")
              out.flush()
              print(s)

          try:
              log("DEBUT ANALYSE")
              prog = currentProgram
              mem = prog.getMemory()
              fm = prog.getFunctionManager()
              ctx = prog.getProgramContext()
              tm = ctx.getRegister("TMode")
              ctx.setValue(tm, toAddr(BASE + 0x100), mem.getMaxAddress(), BigInteger.ONE)

              funcs = [int(x.strip(), 16) & ~1 for x in os.environ.get("FUNCS", "").split(",") if x.strip()]
              log("Fonctions demandees: %s" % [hex(x) for x in funcs])

              seeds = [0x48026a8c, 0x48027408, 0x480218c4, 0x480215cc, 0x480216a0]
              for a in seeds + funcs:
                  try:
                      disassemble(toAddr(a))
                      if fm.getFunctionAt(toAddr(a)) is None:
                          createFunction(toAddr(a), None)
                  except Exception:
                      log("seed %x: %s" % (a, traceback.format_exc()))

              log("Lancement analyzeAll")
              analyzeAll(prog)
              log("analyzeAll termine, fonctions: %d" % fm.getFunctionCount())

              di = DecompInterface()
              di.openProgram(prog)
              mon = ConsoleTaskMonitor()

              for a in funcs:
                  try:
                      f = fm.getFunctionContaining(toAddr(a))
                      log("=" * 70)
                      if f is None:
                          log("Aucune fonction a 0x%x" % a)
                          continue
                      log("FONCTION demandee 0x%x -> %s @ %s (offset fichier 0x%x)" % (a, f.getName(), f.getEntryPoint(), f.getEntryPoint().getOffset() - BASE + 0x200))
                      r = di.decompileFunction(f, 180, mon)
                      if r.decompileCompleted():
                          log(r.getDecompiledFunction().getC())
                      else:
                          log("ECHEC DECOMPILATION")
                  except Exception:
                      log("ERREUR %x\n%s" % (a, traceback.format_exc()))
              log("FIN ANALYSE")
          except Exception:
              log("ERREUR FATALE\n%s" % traceback.format_exc())
          out.close()
          PYEOF

      - name: Lancer Ghidra (headless)
        env:
          FUNCS: ${{ github.event.inputs.funcs }}
        run: |
          mkdir -p proj
          ./ghidra/support/analyzeHeadless proj lkproj \
            -import lk.bin \
            -processor "ARM:LE:32:v7" \
            -loader BinaryLoader \
            -loader-baseAddr "${{ github.event.inputs.base_addr }}" \
            -noanalysis \
            -scriptPath "$PWD" \
            -postScript lk_report.py 2>&1 | tee ghidra.log

      - name: Afficher le rapport
        if: always()
        run: |
          ls -l /tmp/report.txt || true
          head -c 60000 /tmp/report.txt || true
          cp /tmp/report.txt . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lk-report
          path: |
            report.txt
            ghidra.log
