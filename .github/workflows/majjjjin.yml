name: Upload URL to GoFile

on:
  workflow_dispatch:
    inputs:
      url:
        description: "رابط مباشر للملف (يجب أن يبدأ بـ https://)"
        required: true
      filename:
        description: "اسم الملف بعد الرفع (اختياري، إذا تُرك فارغاً يُستخدم اسم الملف من الرابط)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Download file from URL
        env:
          SOURCE_URL: ${{ github.event.inputs.url }}
          CUSTOM_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -euo pipefail

          case "$SOURCE_URL" in
            https://*) ;;
            *) echo "ERROR: URL must start with https://" >&2; exit 1 ;;
          esac

          if [ -n "$CUSTOM_NAME" ]; then
            NAME="$CUSTOM_NAME"
          else
            NAME="$(basename "${SOURCE_URL%%\?*}")"
          fi

          case "$NAME" in
            ""|.|..|*/*) echo "ERROR: invalid file name: $NAME" >&2; exit 1 ;;
          esac

          DEST="$RUNNER_TEMP/$NAME"
          curl -sSL --fail --retry 3 --retry-delay 5 \
            -o "$DEST" "$SOURCE_URL"

          SIZE="$(stat -c %s "$DEST")"
          if [ "$SIZE" -eq 0 ]; then
            echo "ERROR: downloaded file is empty" >&2
            exit 1
          fi

          echo "UPLOAD_FILE=$DEST" >> "$GITHUB_ENV"
          echo "Downloaded $NAME ($SIZE bytes)"

      - name: Upload to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_HEADER=()
          if [ -n "${GOFILE_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $GOFILE_TOKEN")
          fi

          RESPONSE="$(curl -sS --fail-with-body \
            "${AUTH_HEADER[@]}" \
            -F "file=@${UPLOAD_FILE}" \
            https://upload.gofile.io/uploadfile)"

          STATUS="$(echo "$RESPONSE" | jq -r '.status')"
          if [ "$STATUS" != "ok" ]; then
            echo "ERROR: upload failed: $RESPONSE" >&2
            exit 1
          fi

          LINK="$(echo "$RESPONSE" | jq -r '.data.downloadPage')"
          echo "GoFile link: $LINK"
          echo "- GoFile: $LINK" >> "$GITHUB_STEP_SUMMARY"
